# orgs.toml: AWS IAM Identity Center organizations managed by rolehop.
# Copy this file to ~/.config/rolehop/orgs.toml and edit it. It contains no secrets.
# Then: `rolehop sync --dry-run` to review, `rolehop sync` to apply and `awslogin` to sign in.
#
# Each [[org]] generates:
#   [sso-session <name>]                      → one login per org (awslogin <name>)
#   [profile <name>-<account>-<role>]         → one profile per account and role
#   [profile <name>-<assume_role.name>]       → optional chained profiles
#
# Profiles renew automatically for as long as the Identity Center portal session lasts.

[[org]]
name = "acme"                                  # lowercase letters, digits, - or _
start_url = "https://ACME.awsapps.com/start"   # access portal URL
sso_region = "us-east-1"                          # region where Identity Center lives
region = "us-east-1"                              # default region for the profiles
login_flow = "device"                             # "device" (recommended on WSL) or "pkce"
portal_session_hours = 8                          # portal session duration (used only for estimates)
default_role = "ro"                               # role `rolehop status` uses to test the session
# probe_profile = "acme-devsecops-ro"          # optional: fixed profile to test the session

# Short aliases → exact permission set name in Identity Center.
# In accounts you can use either the alias or the exact permission set name.
[org.roles]
ro = "ReadOnly"
power = "PowerUser"
admin = "Administrator"

[[org.accounts]]
name = "devsecops"            # part of the profile name: acme-devsecops-admin
id = "111111111111"
roles = ["ro", "power", "admin"]

[[org.accounts]]
name = "prod"
id = "222222222222"
roles = ["ro", "admin"]
# region = "us-east-2"        # optional: a different region for this account

# Optional: IAM roles assumed from an SSO profile (role chaining).
# source = "<account>-<role>" from this same org. Each hop lasts at most 1 h, but renews automatically.
# [[org.assume_roles]]
# name = "deploy-prod"                                      # → profile acme-deploy-prod
# role_arn = "arn:aws:iam::222222222222:role/DeployRole"
# source = "devsecops-admin"
# external_id = "optional"
# duration_seconds = 3600

# Second organization (another Identity Center portal).
[[org]]
name = "personal"
start_url = "https://PERSONAL.awsapps.com/start"
sso_region = "us-east-1"
region = "us-east-1"
login_flow = "device"
portal_session_hours = 8
default_role = "admin"

[org.roles]
admin = "AdministratorAccess"

[[org.accounts]]
name = "main"
id = "333333333333"
roles = ["admin"]
