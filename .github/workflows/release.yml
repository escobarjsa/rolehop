name: Release
# Al subir una etiqueta vX.Y.Z: tests, build, Release de GitHub con el wheel y el sdist adjuntos
# y, si la variable del repo PUBLISH_TO_PYPI vale "true", publicación en PyPI con Trusted Publishing.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: uv run --group dev ruff check src tests
      - run: uv run --group dev pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Build release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > notes.md
          wheel=$(basename dist/*.whl)
          {
            echo ""
            echo "## Install or upgrade"
            echo ""
            echo '```bash'
            echo "uv tool install --force https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${wheel}"
            echo "# or, if rolehop is already installed:"
            echo "rolehop upgrade"
            echo '```'
            echo ""
            echo "Documentation: https://escobarjsa.github.io/rolehop/"
          } >> notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "rolehop $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rolehop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
