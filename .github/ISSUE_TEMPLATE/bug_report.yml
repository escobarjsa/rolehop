name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not paste credentials, SSO tokens, real account IDs or the contents of `~/.aws/sso/cache` or `~/.aws/credentials`.** Replace account IDs with placeholders such as `111111111111`.
        Security issues must be reported privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. rolehop init ...
        2. rolehop sync ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Output of `rolehop status --json` and `rolehop sync --dry-run`, with account IDs redacted.
      render: text
  - type: input
    id: rolehop-version
    attributes:
      label: rolehop version
      placeholder: rolehop --version
    validations:
      required: true
  - type: input
    id: aws-version
    attributes:
      label: AWS CLI version
      placeholder: aws --version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, WSL, macOS, Other]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent involved (if any)
      options: [None, Claude Code, Codex CLI, Kiro, Copilot CLI, Gemini CLI, Qwen Code, OpenCode, Amp, Pi, Devin Desktop, Cursor, Other]
