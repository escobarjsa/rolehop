[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "awsorg"
version = "1.2.0"
description = "Perfiles AWS IAM Identity Center para varias organizaciones que se renuevan solos, listos para humanos y agentes de IA (Claude Code, Codex, Kiro, Gemini…)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "escobarjsa" }]
keywords = ["aws", "sso", "iam-identity-center", "aws-cli", "profiles", "claude-code", "codex", "kiro", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: Spanish",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/escobarjsa/awsorg"
Repository = "https://github.com/escobarjsa/awsorg"
Issues = "https://github.com/escobarjsa/awsorg/issues"
Changelog = "https://github.com/escobarjsa/awsorg/blob/main/CHANGELOG.md"

[project.scripts]
awsorg = "awsorg.cli:main"
awslogin = "awsorg.cli:awslogin_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/awsorg"]

[tool.hatch.build.targets.sdist]
include = ["src/awsorg", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["S603", "S607", "S310", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
