[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rolehop"
version = "1.5.0"
description = "Auto-refreshing AWS IAM Identity Center profiles for many organizations, ready for humans and AI coding agents (Claude Code, Codex, Kiro, Gemini…)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "escobarjsa" }]
keywords = ["aws", "sso", "aws-sso", "rolehop", "iam-identity-center", "aws-cli", "profiles", "claude-code", "codex", "kiro", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/escobarjsa/rolehop"
Documentation = "https://escobarjsa.github.io/rolehop/"
Repository = "https://github.com/escobarjsa/rolehop"
Issues = "https://github.com/escobarjsa/rolehop/issues"
Changelog = "https://github.com/escobarjsa/rolehop/blob/main/CHANGELOG.md"

[project.scripts]
rolehop = "rolehop.cli:main"
awslogin = "rolehop.cli:awslogin_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["zensical>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolehop"]

[tool.hatch.build.targets.sdist]
include = ["src/rolehop", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "docs", "zensical.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["S603", "S607", "S310", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
