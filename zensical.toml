[project]
site_name = "rolehop"
site_description = "Auto-refreshing AWS IAM Identity Center profiles for many organizations, ready for humans and AI coding agents."
site_author = "escobarjsa"
site_url = "https://escobarjsa.github.io/rolehop/"
copyright = "Copyright &copy; 2026 rolehop contributors · MIT License"
repo_url = "https://github.com/escobarjsa/rolehop"
repo_name = "escobarjsa/rolehop"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
  ] },
  { "User guide" = [
    "guide/daily-workflow.md",
    "guide/configuration.md",
    "guide/managing-organizations.md",
    "guide/ai-agents.md",
    "guide/unattended-work.md",
    "guide/per-repo-defaults.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/how-it-works.md",
    "reference/security.md",
    "reference/troubleshooting.md",
    "reference/migrating-from-awsorg.md",
  ] },
  { "Changelog" = "https://github.com/escobarjsa/rolehop/blob/main/CHANGELOG.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/key-round"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/escobarjsa/rolehop"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/rolehop/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
